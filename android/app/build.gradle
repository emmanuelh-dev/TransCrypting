plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'app.transcrypting.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'app.transcrypting.mobile'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.1.2'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.k2fsa:sherpa-onnx:2.0.3@aar'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}
